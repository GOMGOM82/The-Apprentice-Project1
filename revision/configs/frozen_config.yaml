frozen_model_specification:
  status: "Frozen (Ready for pretest checklist gating)"
  pipeline_version: "2.0-audited"
  selection_date: "2026-09-11"
  selection_criterion: "Lowest Validation RMSE on 576 holdout validation samples"
  
  preprocessor:
    name: "StandardScaler"
    library: "scikit-learn"
    fit_scope: "X_train (1,728 samples only)"
    leakage_prevention: "Fitted strictly on training partition, transform only on validation/test"

  model:
    algorithm: "LightGBM Regressor"
    version: "lightgbm 4.x"
    objective: "regression (L2 squared error loss)"
    hyperparameters:
      n_estimators: 100
      max_depth: 3
      learning_rate: 0.03
      num_leaves: 15
      random_state: 42
      verbose: -1
